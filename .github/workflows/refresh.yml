name: refresh-live
on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["assets/**"]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools uharfbuzz
      - run: PROFILE_ONLY=1 python3 scripts/design.py
      - run: python3 scripts/live_stats.py sailwalpranjal
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
      - run: |
          git config user.name "Pranjal Sailwal"
          git config user.email "pranjalsailwal09@gmail.com"
          git add assets
          git diff --cached --quiet || (git commit -m "refresh live visuals" && git pull --rebase origin main && git push)
